name: Update content from Are.na

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-content
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch content from Are.na
        run: node scripts/fetch-arena.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain data/arena.json)" ]; then
            echo "No changes on Are.na."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/arena.json
          git commit -m "Update content from Are.na"
          git push
